spring.application.name=HotelBE

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=A3ChiPQSe1910;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server Configuration
server.port=8080

# Local staff account. Change these credentials for your environment.
hotel.staff.email=staff@hotel.local
hotel.staff.password=123456

# JWT signing key must contain at least 32 bytes.
hotel.jwt.secret=local-development-signing-key-change-before-deploying-123456
hotel.jwt.expiration-ms=86400000
